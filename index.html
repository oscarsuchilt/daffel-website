<head>
<meta charset="UTF-8">

<title>Barrio Inn — Hostelería · Monterrey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: #faf8f4; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.4; cursor: pointer; }
  select { background: transparent; }
  @keyframes fadeUpDown {
    0%, 100% { opacity: 0.2; transform: scaleY(0.6); transform-origin: top; }
    50% { opacity: 0.8; transform: scaleY(1); }
  }
  /* Tweaks panel */
  #tweaks-panel {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 40px rgba(26,42,74,0.18);
    width: 280px; padding: 24px;
    display: none; flex-direction: column; gap: 18px;
    border: 1px solid rgba(26,42,74,0.08);
  }
  #tweaks-panel.visible { display: flex; }
  .tweak-label {
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700;
    color: #6b7a8d; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px;
  }
  .tweak-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .tweak-chip {
    padding: 6px 14px; border-radius: 99px; border: 1.5px solid rgba(26,42,74,0.12);
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    color: #1a2a4a; cursor: pointer; background: #fff; transition: all 0.15s;
  }
  .tweak-chip.active { background: #1a2a4a; color: #fff; border-color: #1a2a4a; }
  .tweak-title {
    font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; color: #1a2a4a;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tweak-close { background: none; border: none; cursor: pointer; font-size: 18px; color: #6b7a8d; line-height: 1; }
  .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2.5px solid transparent; transition: border-color 0.15s; }
  .color-swatch.active { border-color: #1a2a4a; }

  /* Floating WA button */
  #wa-float {
    position: fixed; bottom: 24px; left: 24px; z-index: 9998;
    background: #25D366; border-radius: 50%; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(37,211,102,0.4);
    text-decoration: none; transition: transform 0.2s, box-shadow 0.2s;
  }
  #wa-float:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(37,211,102,0.5); }
</style>
</head>
<body>
<div id="root"></div>

    <path d="M12 0C5.373 0 0 5.373 0 12c0 2.118.55 4.112 1.512 5.843L0 24l6.335-1.493A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.895 0-3.668-.522-5.183-1.43L3 21.5l.943-3.755A9.954 9.954 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/>

<!-- Tweaks Panel -->
<div id="tweaks-panel">
  <div class="tweak-title">
    Tweaks
    <button class="tweak-close" id="tweaks-close">×</button>
  </div>
  <div>
    <div class="tweak-label">Acento de color</div>
    <div class="tweak-row" id="accent-swatches">
      <div class="color-swatch active" data-color="#4ec9c9" style="background:#4ec9c9"></div>
      <div class="color-swatch" data-color="#f4845f" style="background:#f4845f"></div>
      <div class="color-swatch" data-color="#a78bfa" style="background:#a78bfa"></div>
      <div class="color-swatch" data-color="#f9c74f" style="background:#f9c74f"></div>
      <div class="color-swatch" data-color="#90be6d" style="background:#90be6d"></div>
    </div>
  </div>
  <div>
    <div class="tweak-label">Fondo del sitio</div>
    <div class="tweak-row" id="bg-chips">
      <div class="tweak-chip active" data-bg="#faf8f4">Crema</div>
      <div class="tweak-chip" data-bg="#ffffff">Blanco</div>
      <div class="tweak-chip" data-bg="#f0f4f8">Frío</div>
    </div>
  </div>
  <div>
    <div class="tweak-label">Tipografía heading</div>
    <div class="tweak-row" id="font-chips">
      <div class="tweak-chip active" data-font="'Playfair Display', serif">Playfair</div>
      <div class="tweak-chip" data-font="'Georgia', serif">Georgia</div>
      <div class="tweak-chip" data-font="'DM Sans', sans-serif">DM Sans</div>
    </div>
  </div>
</div>

<script type="text/babel" src="barrio-inn-sections.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#4ec9c9",
  "bgColor": "#faf8f4",
  "headingFont": "'Playfair Display', serif"
}/*EDITMODE-END*/;

function App() {
  return (
    <div>
      <Nav />
      <Hero />
      <WhySection />
      <LocationsSection />
      <AmenitiesSection />
      <MapSection />
      <TourCTA />
      <FAQ />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
// ── Tweaks panel protocol ─────────────────────────────────────────────────────
(function() {
  const panel = document.getElementById('tweaks-panel');

  window.addEventListener('message', e => {
    if (e.data?.type === '__activate_edit_mode') {
      panel.classList.add('visible');
    } else if (e.data?.type === '__deactivate_edit_mode') {
      panel.classList.remove('visible');
    }
  });

  window.parent.postMessage({ type: '__edit_mode_available' }, '*');

  document.getElementById('tweaks-close').addEventListener('click', () => {
    panel.classList.remove('visible');
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  });

  // Accent color swatches
  document.getElementById('accent-swatches').addEventListener('click', e => {
    const sw = e.target.closest('.color-swatch');
    if (!sw) return;
    const color = sw.dataset.color;
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    // Apply to CSS variables
    document.documentElement.style.setProperty('--accent', color);
    // Update all teal-colored elements via inline style override
    document.querySelectorAll('[style*="#4ec9c9"], [style*="#3ab5b5"]').forEach(el => {
      el.style.background = el.style.background.replace(/#4ec9c9|#3ab5b5/g, color);
      el.style.color = el.style.color.replace(/#4ec9c9/g, color);
    });
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: color } }, '*');
  });

  // Background chips
  document.getElementById('bg-chips').addEventListener('click', e => {
    const chip = e.target.closest('.tweak-chip');
    if (!chip) return;
    const bg = chip.dataset.bg;
    document.querySelectorAll('#bg-chips .tweak-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    document.body.style.background = bg;
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { bgColor: bg } }, '*');
  });

  // Font chips
  document.getElementById('font-chips').addEventListener('click', e => {
    const chip = e.target.closest('.tweak-chip');
    if (!chip) return;
    const font = chip.dataset.font;
    document.querySelectorAll('#font-chips .tweak-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    document.querySelectorAll('h1,h2,h3').forEach(el => el.style.fontFamily = font);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { headingFont: font } }, '*');
  });
})();
</script>
</body>
</html>
